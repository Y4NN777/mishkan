schema_version: "1.0"
tool_id: search.structural
version: 1.0.0
crewai_name: search_structural
summary: Search bounded Python syntax trees without claiming semantic coverage.
effect_class: read
source_id: bundled.core
source_kind: native
adapter: python.ast.search.structure
operation_evidence: true
input_schema:
  type: object
  additionalProperties: false
  required: [path, node_types]
  properties:
    path: {type: string, minLength: 1}
    language: {type: string, const: python}
    node_types:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, enum: [FunctionDef, AsyncFunctionDef, ClassDef, Call, Import, ImportFrom, Assign, AnnAssign]}
    name: {type: string, minLength: 1}
    include: {type: array, items: {type: string, minLength: 1}}
    exclude: {type: array, items: {type: string, minLength: 1}}
    include_hidden: {type: boolean}
    max_results: {type: integer, minimum: 1}
    max_files: {type: integer, minimum: 1}
result_schema:
  type: object
  additionalProperties: false
  required: [root, matches, engine, engine_version, coverage, semantic_coverage, normalized_query, query_digest, freshness, limits, examined_files, omissions, failures, truncated, continuation_cursor, operation_evidence]
  properties:
    root: {type: string}
    matches:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [path, node_type, name, line, end_line]
        properties:
          path: {type: string}
          node_type: {type: string}
          name: {type: [string, "null"]}
          line: {type: integer, minimum: 1}
          end_line: {type: integer, minimum: 1}
    engine: {type: string, const: python.ast}
    engine_version: {type: string}
    coverage: {type: string, const: syntax}
    semantic_coverage: {type: boolean, const: false}
    normalized_query: {type: object}
    query_digest: {type: string, pattern: "^[a-f0-9]{64}$"}
    freshness: {type: string, const: live-worktree}
    limits: {type: object}
    examined_files: {type: integer, minimum: 0}
    omissions: {type: array, items: {type: string}}
    failures: {type: array, items: {type: string}}
    truncated: {type: boolean}
    continuation_cursor: {type: "null"}
    operation_evidence: {$ref: "#/$defs/operation_evidence"}
  $defs:
    operation_evidence:
      type: object
      additionalProperties: false
      required: [repository_id, revision, working_tree_dirty, working_tree_fingerprint, scope, engine, engine_version, normalized_query, freshness, limits, omissions, failures, truncated, continuation, base_revision_token]
      properties:
        repository_id: {type: string}
        revision: {type: string}
        working_tree_dirty: {type: boolean}
        working_tree_fingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
        scope: {type: array, items: {type: string}}
        engine: {type: string}
        engine_version: {type: string}
        normalized_query: {type: object}
        freshness: {type: object}
        limits: {type: object}
        omissions: {type: array, items: {type: string}}
        failures: {type: array, items: {type: string}}
        truncated: {type: boolean}
        continuation: {type: [string, integer, "null"]}
        base_revision_token: {type: [string, "null"]}
timeout_behavior: cancel_local
idempotency: idempotent
target_scopes: [path]
target_arguments: {path: [path]}
resources: {timeout_seconds: 30, memory_mb: 128, network: false, concurrency: 1}
adapter_config: {max_results: 1000, max_files: 10000, max_file_bytes: 2097152}
