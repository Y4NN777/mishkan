schema_version: "1.0"
tool_id: file.list
version: 1.0.0
crewai_name: file_list
summary: List one directory or bounded tree with deterministic pagination and visible omissions.
effect_class: read
source_id: bundled.core
source_kind: native
adapter: native.file.list
operation_evidence: true
input_schema:
  type: object
  additionalProperties: false
  required: [path]
  properties:
    path: {type: string, minLength: 1}
    recursive: {type: boolean}
    max_depth: {type: integer, minimum: 1}
    include:
      type: array
      items: {type: string, minLength: 1}
    exclude:
      type: array
      items: {type: string, minLength: 1}
    include_hidden: {type: boolean}
    follow_links: {type: boolean}
    object_types:
      type: array
      items: {type: string, enum: [file, directory, symlink, special]}
    max_results: {type: integer, minimum: 1}
    cursor: {type: string, minLength: 1}
result_schema:
  type: object
  additionalProperties: false
  required:
    - root
    - entries
    - ordering
    - query_digest
    - view_digest
    - engine
    - engine_version
    - ignore_evidence
    - inaccessible
    - cycles
    - truncated
    - continuation_cursor
    - changed_during_list
    - operation_evidence
  properties:
    root: {type: string}
    entries:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [path, object_type, depth, size, link_target]
        properties:
          path: {type: string}
          object_type: {type: string, enum: [file, directory, symlink, special]}
          depth: {type: integer, minimum: 1}
          size: {type: [integer, "null"], minimum: 0}
          link_target: {type: [string, "null"]}
    ordering: {type: string, const: path-bytewise-ascending}
    query_digest: {type: string}
    view_digest: {type: string}
    engine: {type: string}
    engine_version: {type: string}
    ignore_evidence:
      type: object
      additionalProperties: false
      required: [hidden, include, exclude]
      properties:
        hidden: {type: string, enum: [included, excluded]}
        include: {type: array, items: {type: string}}
        exclude: {type: array, items: {type: string}}
    inaccessible:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [path, error]
        properties:
          path: {type: string}
          error: {type: string}
    cycles: {type: array, items: {type: string}}
    truncated: {type: boolean}
    continuation_cursor: {type: [string, "null"]}
    changed_during_list: {type: boolean}
    operation_evidence: {$ref: "#/$defs/operation_evidence"}
  $defs:
    operation_evidence:
      type: object
      additionalProperties: false
      required: [repository_id, revision, working_tree_dirty, working_tree_fingerprint, scope, engine, engine_version, normalized_query, freshness, limits, omissions, failures, truncated, continuation, base_revision_token]
      properties:
        repository_id: {type: string}
        revision: {type: string}
        working_tree_dirty: {type: boolean}
        working_tree_fingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
        scope: {type: array, items: {type: string}}
        engine: {type: string}
        engine_version: {type: string}
        normalized_query: {type: object}
        freshness: {type: object}
        limits: {type: object}
        omissions: {type: array, items: {type: string}}
        failures: {type: array, items: {type: string}}
        truncated: {type: boolean}
        continuation: {type: [string, integer, "null"]}
        base_revision_token: {type: [string, "null"]}
timeout_behavior: cancel_local
idempotency: idempotent
target_scopes: [path]
target_arguments: {path: [path]}
resources: {timeout_seconds: 30, memory_mb: 64, network: false, concurrency: 1}
adapter_config:
  max_results: 1000
  max_traversal_entries: 100000
