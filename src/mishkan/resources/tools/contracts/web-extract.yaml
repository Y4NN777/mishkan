schema_version: "1.0"
tool_id: web.extract
version: 1.0.0
crewai_name: web_extract
summary: Derive attributable text from one immutable retrieved artifact.
effect_class: read
source_id: bundled.core
source_kind: native
adapter: native.web.extract
input_schema:
  type: object
  additionalProperties: false
  required: [request, credential_refs, declared_effects]
  properties:
    request: {type: object}
    credential_refs: {type: array, maxItems: 0}
    declared_effects: {type: array, items: {type: string}, uniqueItems: true}
    sensitivity: {type: string}
    retention: {type: string}
result_schema: {type: object}
timeout_behavior: cancel_local
idempotency: idempotent
target_scopes: [external_resource]
target_arguments: {external_resource: [request.artifact_reference]}
credential_arguments: [credential_refs]
policy_arguments: [declared_effects]
resources: {timeout_seconds: 60, memory_mb: 512, network: false, concurrency: 1}
