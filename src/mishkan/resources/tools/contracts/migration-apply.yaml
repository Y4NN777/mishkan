schema_version: "1.0"
tool_id: migration.apply
version: 1.0.0
crewai_name: migration_apply
summary: Apply one validated migration plan to one exact environment.
effect_class: migration
source_id: bundled.core
source_kind: operator
adapter: operator.migration.apply
input_schema:
  type: object
  additionalProperties: false
  required: [environment, migration_id, plan_fingerprint]
  properties:
    environment: {type: string}
    migration_id: {type: string}
    plan_fingerprint: {type: string}
result_schema:
  type: object
  additionalProperties: false
  required: [environment, migration_id, external_reference]
  properties:
    environment: {type: string}
    migration_id: {type: string}
    external_reference: {type: string}
timeout_behavior: effect_may_be_uncertain
idempotency: none
target_scopes: [environment, external_resource, network]
credential_refs: [migration.target]
