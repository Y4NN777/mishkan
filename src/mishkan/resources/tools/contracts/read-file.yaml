schema_version: "1.0"
tool_id: repository.read_file
version: 1.0.0
crewai_name: repository_read_file
summary: Read one exact repository-relative file bound to the accepted task.
effect_class: read
source_id: bundled.core
source_kind: native
adapter: native.repository.read_file
input_schema:
  type: object
  additionalProperties: false
  required: [path]
  properties:
    path: {type: string, minLength: 1}
result_schema:
  type: object
  additionalProperties: false
  required: [path, content]
  properties:
    path: {type: string}
    content: {type: string}
timeout_behavior: cancel_local
idempotency: idempotent
target_scopes: [path]
adapter_config:
  max_bytes: 262144
