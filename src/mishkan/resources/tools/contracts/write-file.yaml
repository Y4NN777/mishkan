schema_version: "1.0"
tool_id: repository.write_file
version: 1.0.0
crewai_name: repository_write_file
summary: Write one exact repository-relative file bound to the accepted task.
effect_class: filesystem_write
source_id: bundled.core
source_kind: native
adapter: native.repository.write_file
input_schema:
  type: object
  additionalProperties: false
  required: [path, content]
  properties:
    path: {type: string, minLength: 1}
    content: {type: string}
result_schema:
  type: object
  additionalProperties: false
  required: [path, bytes_written, diff]
  properties:
    path: {type: string}
    bytes_written: {type: integer, minimum: 0}
    diff: {type: string}
timeout_behavior: cancel_local
idempotency: idempotent
target_scopes: [path]
target_arguments: {path: [path]}
resources: {timeout_seconds: 30, memory_mb: 64, network: false, concurrency: 1}
