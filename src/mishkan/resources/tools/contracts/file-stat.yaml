schema_version: "1.0"
tool_id: file.stat
version: 1.0.0
crewai_name: file_stat
summary: Inspect bounded metadata for one resolved filesystem object.
effect_class: read
source_id: bundled.core
source_kind: native
adapter: native.file.stat
operation_evidence: true
input_schema:
  type: object
  additionalProperties: false
  required: [path]
  properties:
    path: {type: string, minLength: 1}
    digest: {type: boolean}
result_schema:
  type: object
  additionalProperties: false
  required: [path, object_type, size, permissions, modified_ns, object_identity, digest, operation_evidence]
  properties:
    path: {type: string}
    object_type: {type: string, enum: [file, directory]}
    size: {type: integer, minimum: 0}
    permissions: {type: integer, minimum: 0}
    modified_ns: {type: integer}
    object_identity:
      type: object
      additionalProperties: false
      required: [device, inode]
      properties:
        device: {type: integer, minimum: 0}
        inode: {type: integer, minimum: 0}
    digest: {type: [string, "null"]}
    operation_evidence: {$ref: "#/$defs/operation_evidence"}
  $defs:
    operation_evidence:
      type: object
      additionalProperties: false
      required: [repository_id, revision, working_tree_dirty, working_tree_fingerprint, scope, engine, engine_version, normalized_query, freshness, limits, omissions, failures, truncated, continuation, base_revision_token]
      properties:
        repository_id: {type: string}
        revision: {type: string}
        working_tree_dirty: {type: boolean}
        working_tree_fingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
        scope: {type: array, items: {type: string}}
        engine: {type: string}
        engine_version: {type: string}
        normalized_query: {type: object}
        freshness: {type: object}
        limits: {type: object}
        omissions: {type: array, items: {type: string}}
        failures: {type: array, items: {type: string}}
        truncated: {type: boolean}
        continuation: {type: [string, integer, "null"]}
        base_revision_token: {type: [string, "null"]}
timeout_behavior: cancel_local
idempotency: idempotent
target_scopes: [path]
target_arguments: {path: [path]}
resources: {timeout_seconds: 10, memory_mb: 64, network: false, concurrency: 1}
adapter_config:
  max_digest_bytes: 16777216
