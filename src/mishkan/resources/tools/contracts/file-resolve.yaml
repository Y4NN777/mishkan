schema_version: "1.0"
tool_id: file.resolve
version: 1.0.0
crewai_name: file_resolve
summary: Resolve one scoped path and report the observed filesystem object.
effect_class: read
source_id: bundled.core
source_kind: native
adapter: native.file.resolve
operation_evidence: true
input_schema:
  type: object
  additionalProperties: false
  required: [path]
  properties:
    path: {type: string, minLength: 1}
result_schema:
  type: object
  additionalProperties: false
  required: [requested_path, lexical_path, resolved_path, exists, object_type, is_symlink, link_chain, operation_evidence]
  properties:
    requested_path: {type: string}
    lexical_path: {type: string}
    resolved_path: {type: string}
    exists: {type: boolean}
    object_type: {type: string, enum: [file, directory, missing, special]}
    is_symlink: {type: boolean}
    link_chain:
      type: array
      items: {type: string}
    operation_evidence: {$ref: "#/$defs/operation_evidence"}
  $defs:
    operation_evidence:
      type: object
      additionalProperties: false
      required: [repository_id, revision, working_tree_dirty, working_tree_fingerprint, scope, engine, engine_version, normalized_query, freshness, limits, omissions, failures, truncated, continuation, base_revision_token]
      properties:
        repository_id: {type: string}
        revision: {type: string}
        working_tree_dirty: {type: boolean}
        working_tree_fingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
        scope: {type: array, items: {type: string}}
        engine: {type: string}
        engine_version: {type: string}
        normalized_query: {type: object}
        freshness: {type: object}
        limits: {type: object}
        omissions: {type: array, items: {type: string}}
        failures: {type: array, items: {type: string}}
        truncated: {type: boolean}
        continuation: {type: [string, integer, "null"]}
        base_revision_token: {type: [string, "null"]}
timeout_behavior: cancel_local
idempotency: idempotent
target_scopes: [path]
target_arguments: {path: [path]}
resources: {timeout_seconds: 10, memory_mb: 32, network: false, concurrency: 1}
