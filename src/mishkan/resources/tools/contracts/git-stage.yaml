schema_version: "1.0"
tool_id: git.stage
version: 1.0.0
crewai_name: git_stage
summary: Stage exact repository-relative paths against an optional exact HEAD.
effect_class: repository_write
source_id: bundled.core
source_kind: native
adapter: native.git.stage
input_schema:
  type: object
  additionalProperties: false
  required: [paths]
  properties:
    paths: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    expected_head: {type: [string, "null"]}
    timeout_seconds: {type: integer, minimum: 1, maximum: 3600, default: 120}
result_schema: {type: object}
timeout_behavior: effect_may_be_uncertain
idempotency: deduplication_key
target_scopes: [path]
target_arguments: {path: [paths]}
resources: {timeout_seconds: 120, memory_mb: 128, network: false, concurrency: 1}
