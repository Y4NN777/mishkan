schema_version: "1.0"
tool_id: web.map
version: 1.0.0
crewai_name: web_map
summary: Map links within an explicit bounded origin and crawler profile.
effect_class: network
source_id: bundled.core
source_kind: native
adapter: native.web.map
input_schema: &crawl_input
  type: object
  additionalProperties: false
  required: [request, network_destinations, credential_refs, declared_effects]
  properties:
    request: {type: object}
    network_destinations: {type: array, items: {type: string}, uniqueItems: true}
    credential_refs: {type: array, maxItems: 0}
    declared_effects: {type: array, items: {type: string}, uniqueItems: true}
    sensitivity: {type: string}
    retention: {type: string}
result_schema: {type: object}
timeout_behavior: cancel_local
idempotency: idempotent
target_scopes: [network]
target_arguments: {network: [network_destinations]}
credential_arguments: [credential_refs]
policy_arguments: [declared_effects]
resources: {timeout_seconds: 300, memory_mb: 512, network: true, concurrency: 8}
