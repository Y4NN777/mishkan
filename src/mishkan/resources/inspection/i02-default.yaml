schema_version: "1.0"
profile_id: bundled.default
revision: "1"
adoption_authority: MISHKAN release
rules:
  - rule_id: private-key-header
    pattern: "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
    action: block
  - rule_id: bearer-token
    pattern: "(?i)authorization\\s*:\\s*bearer\\s+[A-Za-z0-9._~+/-]{8,}"
    action: block
  - rule_id: generic-secret-assignment
    pattern: "(?i)(api[_-]?key|secret|password)\\s*[:=]\\s*[^\\s,;]{8,}"
    action: block
