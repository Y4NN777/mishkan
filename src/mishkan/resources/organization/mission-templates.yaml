schema_version: "1.0"
catalogue_id: bundled-mission-guidance
revision: "1"
templates:
  - template_id: greenfield
    version: "1"
    source: mishkan:bundled
    provenance: [SRS-Appendix-B, PRD-UC-12]
    applicability_signals: [greenfield]
    applicability_exclusions: [existing-repository]
    objective_guidance: [Clarify the intended users, system boundary, and measurable outcome.]
    constraint_guidance: [Record unknown platform and operating constraints explicitly.]
    risk_guidance: [Avoid choosing architecture or infrastructure before attributable evidence.]
    evidence_guidance: [Require discovery and feasibility evidence for each execution context.]
    completion_guidance: [Evaluate the delivered behavior against the confirmed outcome.]
    compatible_organization_versions: ["1"]
    required_responsibility_classes: [product, architecture, engineering, independent-assurance, reporting]
    declared_configuration_conditions: []
    declared_skill_conditions: []
    declared_tool_conditions: []
    declared_execution_conditions: [A verified execution environment is required before dependent work.]
    validation_expectations: [Independent acceptance evidence covers functional and technical risks.]
    reporting_expectations: [Report delivered scope, evidence, residual risks, and unresolved decisions.]

  - template_id: existing-system-change
    version: "1"
    source: mishkan:bundled
    provenance: [SRS-Appendix-B, PRD-UC-12]
    applicability_signals: [existing-repository]
    applicability_exclusions: []
    objective_guidance: [Tie the requested change to observed system behavior and repository evidence.]
    constraint_guidance: [Preserve compatible behavior unless the Brief explicitly changes it.]
    risk_guidance: [Identify regression, migration, integration, and operability risks.]
    evidence_guidance: [Require before-and-after evidence at the affected boundaries.]
    completion_guidance: [Verify the exact change and non-regression of protected behavior.]
    compatible_organization_versions: ["1"]
    required_responsibility_classes: [engineering, independent-assurance, reporting]
    declared_configuration_conditions: []
    declared_skill_conditions: []
    declared_tool_conditions: []
    declared_execution_conditions: [Use project-established environments when verified compatible.]
    validation_expectations: [Independent evaluation covers changed and protected behavior.]
    reporting_expectations: [Report changed paths, validations, residual risks, and compatibility.]

  - template_id: incident-response
    version: "1"
    source: mishkan:bundled
    provenance: [SRS-Appendix-B, PRD-UC-12]
    applicability_signals: [incident]
    applicability_exclusions: []
    objective_guidance: [Separate containment, diagnosis, recovery, and follow-up outcomes.]
    constraint_guidance: [Preserve evidence and current operational authority boundaries.]
    risk_guidance: [Track user impact, recurrence, data integrity, and unsafe recovery actions.]
    evidence_guidance: [Require timestamped observations and attributable operational evidence.]
    completion_guidance: [Confirm recovery and record follow-up work without hiding residual risk.]
    compatible_organization_versions: ["1"]
    required_responsibility_classes: [operations, security, independent-assurance, reporting]
    declared_configuration_conditions: []
    declared_skill_conditions: []
    declared_tool_conditions: []
    declared_execution_conditions: [Operational effects require explicit policy authority.]
    validation_expectations: [Recovery evidence is independent from the actor applying remediation.]
    reporting_expectations: [Report timeline, impact, actions, recovery proof, and follow-ups.]

  - template_id: research
    version: "1"
    source: mishkan:bundled
    provenance: [SRS-Appendix-B, PRD-UC-12]
    applicability_signals: [research]
    applicability_exclusions: []
    objective_guidance: [State the decision the research must inform and its uncertainty.]
    constraint_guidance: [Distinguish acquired evidence, inference, and unverified claims.]
    risk_guidance: [Avoid treating popularity, availability, or model output as authority.]
    evidence_guidance: [Require source provenance, dates, applicability, and contradictory evidence.]
    completion_guidance: [Deliver decision-ready findings, limitations, and recommended validation.]
    compatible_organization_versions: ["1"]
    required_responsibility_classes: [research, evaluation, reporting]
    declared_configuration_conditions: []
    declared_skill_conditions: []
    declared_tool_conditions: []
    declared_execution_conditions: []
    validation_expectations: [An independent evaluator checks attribution and unsupported claims.]
    reporting_expectations: [Report findings, sources, confidence, gaps, and decision impact.]
