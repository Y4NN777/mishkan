schema_version: "1.1"
mode: local
timezone: UTC
project:
  workspace: .
providers:
  ollama-local:
    kind: ollama
    endpoint: http://127.0.0.1:11434
    probe_url: http://127.0.0.1:11434/api/tags
model_routes:
  planning:
    candidates:
      - provider: ollama-local
        model: qwen2.5-coder:7b
  execution:
    candidates:
      - provider: ollama-local
        model: qwen2.5-coder:7b
agent_routes: {}
services: {}
policy_sources:
  - package://mishkan.resources.policies/i02-local.yaml
tool_sources:
  - package://mishkan.resources.tools/i02-catalog.yaml
inspection_profile: package://mishkan.resources.inspection/i02-default.yaml
isolation_profiles:
  - package://mishkan.resources.isolation/local-no-network.yaml
