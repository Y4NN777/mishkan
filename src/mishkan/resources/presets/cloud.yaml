schema_version: "1.1"
mode: cloud
timezone: UTC
project:
  workspace: .
providers:
  cloud-primary:
    kind: openai-compatible
    endpoint: https://api.openai.com/v1
    credential_pool:
      - source: env
        locator: OPENAI_API_KEY
    probe_url: https://api.openai.com/v1/models
model_routes:
  planning:
    candidates:
      - provider: cloud-primary
        model: gpt-5-mini
  execution:
    candidates:
      - provider: cloud-primary
        model: gpt-5-mini
agent_routes: {}
services: {}
policy_sources:
  - package://mishkan.resources.policies/i02-local.yaml
tool_sources:
  - package://mishkan.resources.tools/i02-catalog.yaml
inspection_profile: package://mishkan.resources.inspection/i02-default.yaml
isolation_profiles:
  - package://mishkan.resources.isolation/local-no-network.yaml
