schema_version: "1.0"
profile_id: engineering-default
revision: "1"
descriptor_paths:
  devcontainer:
    - .devcontainer/devcontainer.json
    - .devcontainer.json
  containerfile:
    - Containerfile
    - Dockerfile
  compose:
    - compose.yaml
    - compose.yml
    - docker-compose.yaml
    - docker-compose.yml
  podman_kube:
    - podman-kube.yaml
    - podman-kube.yml
  quadlet:
    - "*.container"
    - "*.pod"
  nix:
    - flake.nix
    - shell.nix
  mise:
    - mise.toml
    - .mise.toml
manifest_names:
  go: [go.mod, go.sum]
  javascript_typescript: [package.json, package-lock.json, pnpm-lock.yaml, yarn.lock, bun.lock]
  java_kotlin_android: [pom.xml, build.gradle, build.gradle.kts, settings.gradle, settings.gradle.kts, gradle-wrapper.properties]
  python: [pyproject.toml, uv.lock, poetry.lock, requirements.txt]
  rust: [Cargo.toml, Cargo.lock]
  c: [CMakeLists.txt, Makefile, meson.build]
  swift: [Package.swift, Package.resolved]
engines:
  - engine_id: posix-shell
    executable_names: [sh]
    semantics: [process.shell]
    platforms: [linux, darwin]
  - engine_id: devcontainer-cli
    executable_names: [devcontainer]
    adapter_id: devcontainer.cli
    semantics: [devcontainer.metadata, devcontainer.lifecycle]
    project_markers: [.devcontainer/devcontainer.json, .devcontainer.json]
  - engine_id: podman
    executable_names: [podman]
    adapter_id: podman.cli
    semantics: [oci.build, oci.run, podman.kube, podman.quadlet]
    platforms: [linux, darwin]
    project_markers: [Containerfile, podman-kube.yaml, podman-kube.yml]
  - engine_id: docker
    executable_names: [docker]
    adapter_id: docker.cli
    semantics: [oci.build, oci.run, compose.lifecycle]
    platforms: [linux, darwin]
    project_markers: [Dockerfile, compose.yaml, compose.yml, docker-compose.yaml, docker-compose.yml]
  - engine_id: podman-compose
    executable_names: [podman-compose]
    adapter_id: podman-compose.cli
    semantics: [compose.lifecycle]
    platforms: [linux, darwin]
    project_markers: [compose.yaml, compose.yml, docker-compose.yaml, docker-compose.yml]
  - engine_id: nix
    executable_names: [nix]
    semantics: [environment.materialize, dependency.acquire]
    project_markers: [flake.nix, shell.nix]
  - engine_id: mise
    executable_names: [mise]
    semantics: [toolchain.materialize]
    project_markers: [mise.toml, .mise.toml]
  - engine_id: go
    executable_names: [go]
    semantics: [language.build, language.test]
    project_markers: [go.mod]
  - engine_id: node
    executable_names: [node]
    semantics: [language.run]
    project_markers: [package.json]
  - engine_id: npm
    executable_names: [npm]
    semantics: [dependency.acquire, language.build, language.test]
    project_markers: [package.json, package-lock.json]
  - engine_id: pnpm
    executable_names: [pnpm]
    semantics: [dependency.acquire, language.build, language.test]
    project_markers: [package.json, pnpm-lock.yaml]
  - engine_id: yarn
    executable_names: [yarn]
    semantics: [dependency.acquire, language.build, language.test]
    project_markers: [package.json, yarn.lock]
  - engine_id: bun
    executable_names: [bun]
    semantics: [dependency.acquire, language.build, language.test]
    project_markers: [package.json, bun.lock]
  - engine_id: java
    executable_names: [java]
    semantics: [language.run]
    project_markers: [pom.xml, build.gradle, build.gradle.kts]
  - engine_id: gradle
    executable_names: [gradle]
    semantics: [language.build, language.test, android.build]
    project_markers: [build.gradle, build.gradle.kts]
  - engine_id: maven
    executable_names: [mvn]
    semantics: [dependency.acquire, language.build, language.test]
    project_markers: [pom.xml]
  - engine_id: python
    executable_names: [python3, python]
    semantics: [language.run, language.test]
    project_markers: [pyproject.toml, requirements.txt]
  - engine_id: rust
    executable_names: [cargo, rustc]
    semantics: [language.build, language.test]
    project_markers: [Cargo.toml]
  - engine_id: c-toolchain
    executable_names: [cc, clang, gcc]
    semantics: [language.build, language.test]
    project_markers: [CMakeLists.txt, Makefile, meson.build]
  - engine_id: cmake
    executable_names: [cmake]
    semantics: [language.build, language.test]
    project_markers: [CMakeLists.txt]
  - engine_id: make
    executable_names: [make]
    semantics: [language.build, language.test]
    project_markers: [Makefile]
  - engine_id: swift
    executable_names: [swift]
    semantics: [language.build, language.test]
    platforms: [linux, darwin]
    project_markers: [Package.swift]
  - engine_id: maestro
    executable_names: [maestro]
    semantics: [mobile.ui.test]
    platforms: [linux, darwin]
    project_markers: [settings.gradle, settings.gradle.kts, Package.swift]
  - engine_id: kubectl
    executable_names: [kubectl]
    semantics: [kubernetes.inspect, kubernetes.lifecycle]
  - engine_id: helm
    executable_names: [helm]
    semantics: [kubernetes.package, kubernetes.lifecycle]
  - engine_id: terraform
    executable_names: [terraform, tofu]
    semantics: [infrastructure.plan, infrastructure.apply]
    project_markers: [main.tf, tofu.lock.hcl, .terraform.lock.hcl]
  - engine_id: ansible
    executable_names: [ansible, ansible-playbook]
    semantics: [configuration.inspect, configuration.apply]
  - engine_id: prometheus
    executable_names: [prometheus, promtool]
    semantics: [observability.metrics, observability.validate]
  - engine_id: grafana
    executable_names: [grafana, grafana-server]
    semantics: [observability.visualize]
  - engine_id: elasticsearch
    executable_names: [elasticsearch]
    semantics: [observability.search]
  - engine_id: minio
    executable_names: [minio, mc]
    semantics: [object-storage.serve, object-storage.inspect]
  - engine_id: postgresql
    executable_names: [psql]
    semantics: [database.inspect, database.query]
  - engine_id: sqlite
    executable_names: [sqlite3]
    semantics: [database.inspect, database.query]
  - engine_id: systemctl-user
    executable_names: [systemctl]
    adapter_id: quadlet.systemctl
    semantics: [quadlet.lifecycle]
    platforms: [linux]
    project_markers: ["*.container", "*.pod"]
adapters:
  - adapter_id: devcontainer.cli
    revision: "1"
    engine_id: devcontainer-cli
    descriptor_formats: [devcontainer]
    operations:
      validate:
        mode: job
        path_engine_ids: [node, posix-shell]
        arguments: [read-configuration, --workspace-folder, .]
      materialize:
        mode: job
        path_engine_ids: [node, posix-shell]
        arguments: [up, --workspace-folder, .]
        declared_effects: [environment.materialize, container.create]
        readiness: output_contains
        readiness_value: outcome
  - adapter_id: podman.cli
    revision: "1"
    engine_id: podman
    descriptor_formats: [containerfile, podman_kube]
    operations:
      build:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [build, --file, "$descriptor", --tag, "$image", .]
        required_parameters: [image]
        declared_effects: [container.image.build]
      start:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [run, --name, "$resource", "$image"]
        required_parameters: [resource, image]
        declared_effects: [container.create, container.start]
        readiness: process_running
      readiness:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [inspect, "$resource"]
        required_parameters: [resource]
      stop:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [stop, "$resource"]
        required_parameters: [resource]
        declared_effects: [container.stop]
      cleanup:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [rm, --force, "$resource"]
        required_parameters: [resource]
        declared_effects: [container.delete]
      materialize:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [kube, play, "$descriptor"]
        declared_effects: [podman.kube.play]
        readiness: process_running
  - adapter_id: docker.cli
    revision: "1"
    engine_id: docker
    descriptor_formats: [containerfile, compose]
    operations:
      build:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [build, --file, "$descriptor", --tag, "$image", .]
        required_parameters: [image]
        declared_effects: [container.image.build]
      materialize:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [compose, --file, "$descriptor", up, --detach]
        declared_effects: [compose.up]
        readiness: process_running
      readiness:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [compose, --file, "$descriptor", ps]
      cleanup:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [compose, --file, "$descriptor", down]
        declared_effects: [compose.down]
  - adapter_id: podman-compose.cli
    revision: "1"
    engine_id: podman-compose
    descriptor_formats: [compose]
    operations:
      validate:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [-f, "$descriptor", config]
      materialize:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [-f, "$descriptor", up, --detach]
        declared_effects: [compose.up]
        readiness: process_running
      readiness:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [-f, "$descriptor", ps]
      cleanup:
        mode: job
        path_engine_ids: [posix-shell]
        arguments: [-f, "$descriptor", down]
        declared_effects: [compose.down]
  - adapter_id: quadlet.systemctl
    revision: "1"
    engine_id: systemctl-user
    descriptor_formats: [quadlet]
    operations:
      materialize:
        mode: job
        arguments: [--user, daemon-reload]
        declared_effects: [quadlet.reload]
      start:
        mode: job
        arguments: [--user, start, "$resource"]
        required_parameters: [resource]
        declared_effects: [service.start]
        readiness: process_running
      readiness:
        mode: job
        arguments: [--user, is-active, "$resource"]
      stop:
        mode: job
        arguments: [--user, stop, "$resource"]
        required_parameters: [resource]
        declared_effects: [service.stop]
resolution_order:
  - explicit_configuration
  - project_declaration
  - execution_environment
  - active_pack
  - isolated_materialization
  - external_capability
  - compatible_fallback
max_observed_files: 10000
max_descriptor_bytes: 4194304
max_manifest_depth: 8
excluded_directories: [.git, .mishkan, .venv, node_modules, build, dist, target]
freshness_seconds: 300
