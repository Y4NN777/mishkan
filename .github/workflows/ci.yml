name: ci

on:
  push:
    branches:
      - main
      - "impl/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Synchronize locked environment
        run: uv sync --locked --dev --python "${{ matrix.python-version }}"

      - name: Test with branch coverage
        run: uv run --python "${{ matrix.python-version }}" pytest --cov=mishkan --cov-branch --cov-fail-under=80

      - name: Lint
        run: uv run --python "${{ matrix.python-version }}" ruff check .

      - name: Check formatting
        run: uv run --python "${{ matrix.python-version }}" ruff format --check .

      - name: Type check
        run: uv run --python "${{ matrix.python-version }}" mypy --strict src

      - name: Verify exported schemas
        run: |
          uv run --python "${{ matrix.python-version }}" mishkan schema export --output definitions/schemas
          git diff --exit-code -- definitions/schemas

      - name: Build distributions
        run: uv build
