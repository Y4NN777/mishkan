name: ci

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "refactor/**"
      - "chore/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: "python-${{ matrix.python-version }}"

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Synchronize locked environment
        run: uv sync --locked --dev --python "${{ matrix.python-version }}"

      - name: Install Chromium and system dependencies
        if: runner.os == 'Linux'
        run: |
          uv run --python "${{ matrix.python-version }}" playwright install --with-deps chromium
          sudo apt-get install --yes ripgrep

      - name: Install Chromium and system dependencies
        if: runner.os == 'macOS'
        run: |
          uv run --python "${{ matrix.python-version }}" playwright install chromium
          brew install ripgrep

      - name: Test with branch coverage
        run: uv run --python "${{ matrix.python-version }}" pytest --cov=mishkan --cov-branch --cov-fail-under=80

      - name: Lint
        run: uv run --python "${{ matrix.python-version }}" ruff check .

      - name: Check formatting
        run: uv run --python "${{ matrix.python-version }}" ruff format --check .

      - name: Type check
        run: >-
          uv run --python "${{ matrix.python-version }}" mypy --strict
          --python-version "${{ matrix.python-version }}"
          --cache-dir "${{ runner.temp }}/mypy-cache" src

      - name: Verify exported schemas
        run: |
          uv run --python "${{ matrix.python-version }}" mishkan schema export --output definitions/schemas
          git diff --exit-code -- definitions/schemas

      - name: Build distributions
        run: uv build

  i05-environments:
    name: I05 real environment adapters / Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: i05-environments

      - name: Install Python and locked project
        run: |
          uv python install 3.11
          uv sync --locked --dev --python 3.11

      - name: Install Podman and the pinned Dev Container CLI gate dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          npm install --prefix "$RUNNER_TEMP/devcontainer" @devcontainers/cli@0.89.0 --no-audit --no-fund
          echo "$RUNNER_TEMP/devcontainer/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Record external engine versions
        run: |
          docker version
          docker compose version
          podman version
          devcontainer --version

      - name: Exercise governed Docker, Compose, Podman, and Dev Container lifecycles
        run: >-
          uv run --python 3.11 pytest -vv
          tests/acceptance/skills_engineering/test_governed_docker_compose.py
          tests/acceptance/skills_engineering/test_governed_devcontainer.py
          tests/acceptance/skills_engineering/test_governed_podman.py
